# GitHub Actions workflow: Deploy apps/api to AWS Lambda on changes
name: Deploy API to Lambda

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install deps
        working-directory: ./apps/api
        run: npm ci

      - name: Run ESLint
        working-directory: ./apps/api
        run: |
          npx eslint "src/**/*.{js,ts,tsx}"

      - name: Run tests
        working-directory: ./apps/api
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install production deps to dist
        working-directory: ./apps/api
        run: |
          mkdir -p dist
          cp package.json dist/
          cp db_names.js dist/
          cp knexfile.js dist/
          cp -r migrations dist/
          cd dist
          npm install --omit=dev

      - name: Install production deps for apps/api
        working-directory: ./apps/api
        run: npm ci

      - name: Build apps/api
        working-directory: ./apps/api
        run: npm run build

      - run: |
          cd infra
          npm install
          # Ensure the environment is bootstrapped so CDK has the toolkit stack,
          # roles and SSM params (idempotent).
          npx cdk bootstrap aws://214745598862/${{ secrets.AWS_REGION }}
          npx cdk deploy --require-approval never
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          NODE_ENV: production

      # Invoke migration lambda — resolve actual function name from CloudFormation
      - run: |
          # Try exact logical id match first (works when CDK logical id is MigrationLambda)
          FUNCTION_NAME=$(aws cloudformation describe-stack-resources \
            --stack-name NailSalonStack \
            --region $AWS_REGION \
            --query "StackResources[?ResourceType=='AWS::Lambda::Function'].[LogicalResourceId,PhysicalResourceId]" --output text \
            | awk '$1=="MigrationLambda" {print $2; exit}')

          # Fallback: search physical names for the word 'migration' (case-insensitive)
          if [ -z "$FUNCTION_NAME" ]; then
            FUNCTION_NAME=$(aws cloudformation describe-stack-resources \
              --stack-name NailSalonStack \
              --region $AWS_REGION \
              --query "StackResources[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" --output text \
              | tr '\t' '\n' | grep -i migration | head -n1 || true)
          fi

          if [ -z "$FUNCTION_NAME" ]; then
            echo "Error: Migration Lambda not found in stack NailSalonStack" >&2
            exit 1
          fi

          echo "Invoking function: $FUNCTION_NAME"
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload '{}' \
            response.json
          cat response.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          NODE_ENV: production
