# GitHub Actions workflow: Deploy apps/api to AWS Lambda on changes
name: Deploy API to Lambda

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # change to required version

      - name: Install & build (apps/api)
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: Package function (zip)
        run: |
          cd apps/api
          # include everything needed for lambda: code, node_modules, built assets
          zip -r ../../function.zip .

      - name: Deploy to Lambda (update code + publish version)
        env:
          FUNCTION_NAME: ${{ secrets.FUNCTION_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file "fileb://function.zip" --region "$AWS_REGION"
          aws lambda publish-version --function-name "$FUNCTION_NAME" --region "$AWS_REGION"

      - name: Clean up zip file
        run: rm function.zip
