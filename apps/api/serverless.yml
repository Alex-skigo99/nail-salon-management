service: nail-salon-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    DATABASE_URL: ${ssm:DATABASE_URL}
    JWT_SECRET: ${ssm:JWT_SECRET}
    FRONTEND_URL: https://yourdomain.vercel.app
  vpc:
    securityGroupIds:
      - sg-xxxxx
    subnetIds:
      - subnet-xxxxx


functions:
  api:
    handler: dist/handler.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY


plugins:
  - serverless-plugin-tracing


package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!.env'
